[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "toolost-uploader"
dynamic = ["version"]
description = "Offline release manifest validation for the Toolost uploader project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Private :: Do Not Upload", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
dev = ["build>=1.2.2,<2", "jsonschema>=4.26,<5"]
browser = ["playwright>=1.64.1,<2"]

[project.scripts]
toolost = "toolost_uploader.cli:main"

[tool.setuptools]
packages = ["toolost_uploader"]
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "toolost_uploader.__version__"}
